<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RaktaSeva">
  <!--
    Brand mark: the same jade rounded square and white heart used by the
    sidebar and nav lockups, so the tab icon matches the in-app logo.
    The fill tracks --color-accent in tokens.css; change one, change both.

    An SVG favicon stays crisp at every size and on every display density,
    which a fixed-resolution .ico cannot do. The .ico is kept only as a
    fallback for browsers that do not support this (Safari below 16.4).
  -->
  <rect width="64" height="64" rx="14" fill="#0F6E60"/>
  <path fill="#ffffff" d="M32 49.5c-.7 0-1.35-.25-1.86-.7C22.9 42.2 14 34.35 14 26.2 14 20.05 18.7 15.5 24.6 15.5c3.02 0 5.86 1.34 7.4 3.42 1.54-2.08 4.38-3.42 7.4-3.42 5.9 0 10.6 4.55 10.6 10.7 0 8.15-8.9 16-16.14 22.6-.51.45-1.16.7-1.86.7z"/>
</svg>
