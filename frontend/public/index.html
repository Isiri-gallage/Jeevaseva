<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>RaktaSeva — Kidney &amp; Blood Donor Network</title>
    <meta
      name="description"
      content="RaktaSeva connects kidney patients in Sri Lanka with living donors, and runs an emergency blood request board. Free, private, and non-commercial."
    />

    <!--
      Two theme-color entries so the mobile browser chrome matches the active
      appearance instead of staying black in light mode.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <!-- Tells the browser to render native controls and scrollbars in both. -->
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Open the font connections early. preconnect resolves DNS, TCP, and TLS
      while the HTML is still parsing, so the stylesheet request in the bundle
      does not pay that cost serially. crossorigin is required on the gstatic
      hint because fonts are fetched in CORS mode.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Social preview -->
    <meta property="og:title" content="RaktaSeva — Kidney &amp; Blood Donor Network" />
    <meta
      property="og:description"
      content="Helping kidney patients in Sri Lanka find living donors. Free, private, non-commercial."
    />
    <meta property="og:type" content="website" />

    <!--
      Applies the saved appearance before React mounts.
      Without this, a dark-mode user sees a white flash on every page load,
      because the stylesheet paints before any component can set the attribute.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('raktaseva-theme');
          var dark =
            saved === 'dark' ||
            ((!saved || saved === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* Storage blocked — the CSS media query still handles it. */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run RaktaSeva.</noscript>
    <div id="root"></div>
  </body>
</html>
