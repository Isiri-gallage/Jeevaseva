server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URL space. Any path that is not a real file must
    # return index.html, otherwise a refresh on /kidney/my-requests would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed bundles never change under the same name, so cache hard.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users get a stale app shell pointing
    # at bundles that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
